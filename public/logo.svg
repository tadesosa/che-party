<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <title>Che Party</title>
  <defs>
    <clipPath id="sh"><path d="M30,40 H270 V170 Q270,270 150,320 Q30,270 30,170 Z" /></clipPath>
    <g id="ray"><path d="M0,-40 Q8,-34 3,-27 Q-6,-33 0,-40Z" /></g>
  </defs>
  <!-- Borde dorado del escudo -->
  <path d="M22,32 H278 V172 Q278,280 150,332 Q22,280 22,172 Z" fill="#f6b40e" stroke="#1b2a4a" stroke-width="7" />
  <!-- Franjas celeste y blanca -->
  <g clip-path="url(#sh)">
    <rect x="30" y="40" width="240" height="290" fill="#ffffff" />
    <rect x="30" y="40" width="80" height="290" fill="#74acdf" />
    <rect x="190" y="40" width="80" height="290" fill="#74acdf" />
  </g>
  <path d="M30,40 H270 V170 Q270,270 150,320 Q30,270 30,170 Z" fill="none" stroke="#1b2a4a" stroke-width="4" />

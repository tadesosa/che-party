  <path d="M292,236 L260,226 L260,272 L292,282 L280,259 Z" fill="#c0392b" stroke="#1b2a4a" stroke-width="4" />
  <path d="M34,224 Q150,246 266,224 L266,270 Q150,292 34,270 Z" fill="#e14b3c" stroke="#1b2a4a" stroke-width="5" />
  <text x="150" y="264" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="38" fill="#ffffff" stroke="#1b2a4a" stroke-width="2" letter-spacing="1">CHE PARTY</text>
  <g fill="#ffffff" stroke="#1b2a4a" stroke-width="2">
    <path d="M70,300 l4,9 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" />

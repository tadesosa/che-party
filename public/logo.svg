      <polygon points="32,-32 23,-16 16,-23" /><polygon points="-32,-32 -23,-16 -16,-23" /><polygon points="32,32 23,16 16,23" /><polygon points="-32,32 -23,16 -16,23" />
      <use href="#ray" transform="rotate(22)" /><use href="#ray" transform="rotate(67)" /><use href="#ray" transform="rotate(112)" /><use href="#ray" transform="rotate(157)" />
      <use href="#ray" transform="rotate(202)" /><use href="#ray" transform="rotate(247)" /><use href="#ray" transform="rotate(292)" /><use href="#ray" transform="rotate(337)" />
      <circle r="22" />
    </g>
    <g fill="#7a4a00"><circle cx="-7" cy="-4" r="2.6" /><circle cx="7" cy="-4" r="2.6" /></g>
    <path d="M-8,7 Q0,13 8,7" stroke="#7a4a00" stroke-width="2.4" fill="none" stroke-linecap="round" />
  </g>
  <!-- La Copa -->
  <g transform="translate(150,182) scale(1.25)">
    <path d="M-26,-34 H26 V-24 Q26,6 0,14 Q-26,6 -26,-24 Z" fill="#f5c518" stroke="#9a7300" stroke-width="3" />
    <path d="M-26,-24 Q-44,-24 -40,-8 Q-36,4 -22,2" fill="none" stroke="#9a7300" stroke-width="5" />
    <path d="M26,-24 Q44,-24 40,-8 Q36,4 22,2" fill="none" stroke="#9a7300" stroke-width="5" />
    <rect x="-6" y="13" width="12" height="14" fill="#f5c518" stroke="#9a7300" stroke-width="3" />
    <rect x="-20" y="26" width="40" height="10" rx="3" fill="#2e9e48" stroke="#1b5e20" stroke-width="3" />
    <rect x="-24" y="35" width="48" height="9" rx="3" fill="#f5c518" stroke="#9a7300" stroke-width="3" />
    <path d="M-16,-28 Q-18,-6 -6,4" stroke="#fff6bf" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8" />
